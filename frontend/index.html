<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smartphone Manager</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f3efe6;--ink:#1d2623;--pine:#1f3a34;--line:#d6d0c2;--card:#fbf9f4;--ok:#2f7d4f;--bad:#b3402f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
header{background:var(--pine);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}nav button{flex:1;min-width:84px}
main{padding:12px;max-width:760px;margin:auto}
button,input,select,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;margin:4px 0}
button{background:var(--pine);color:#fff;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.4}
nav button{background:#fff;color:var(--ink);border:1px solid var(--line)}nav button.on{background:var(--pine);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .sm{flex:none;width:auto}.pg{text-align:center;font-size:.9rem}
.dev{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:10px 12px;margin:8px 0}
.dev.parallele{border-left-color:#c58a1b}
.acts{display:flex;gap:6px}.acts button{padding:8px;margin:6px 0 0}.acts .del{background:var(--bad)}
small{color:#5d6761}.msg{padding:10px;border-radius:8px;margin:8px 0}.err{background:#f6dcd7;color:var(--bad)}.good{background:#d9eddf;color:var(--ok)}
.b{font-size:.75rem;padding:2px 8px;border-radius:99px;color:#fff;font-weight:600}.b-autorise{background:var(--ok)}.b-non_autorise{background:#c58a1b}.b-bloque{background:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0;font-size:.9rem}dt{color:#5d6761}dd{margin:0;word-break:break-word}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.stat b{font-size:1.5rem;display:block}
#modal,#scan{position:fixed;inset:0;background:rgba(20,28,25,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;z-index:9;color:#fff}
#modal{overflow:auto;justify-content:flex-start}.box{background:var(--bg);color:var(--ink);border-radius:12px;padding:14px;width:100%;max-width:560px}
.x{background:#fff;color:var(--ink);border:1px solid var(--line)}#vid{width:100%;max-width:520px;border-radius:12px;background:#000}
:focus-visible{outline:3px solid #c58a1b;outline-offset:2px}
</style><link rel="stylesheet" href="extras.css">
<link rel="stylesheet" href="ui.css">
</head><body>
<header><strong>📱 SmartStock TN</strong><button id="out" style="width:auto;margin:0;display:none" onclick="logout()">Sign out</button></header>
<div id="app"></div>
<script>
const sbc = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id), app = $("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SAJ = {autorise:"Autorisé", non_autorise:"Non autorisé", bloque:"Bloqué"}, CAT = {tunisien:"Tunisien", parallele:"Parallèle"};
const fmt = n => n == null ? "—" : Number(n).toFixed(3) + " TND";
const fdate = s => s ? new Date(s).toLocaleString("fr-FR", {timeZone:"Africa/Tunis"}) : "—";
const PS = 10, S = {stock:{page:1,q:""}, sold:{page:1,q:""}}, rows = {}, loaders = {};
let tab = "stock", current = null;

async function api(path, opts = {}) {
  const { data } = await sbc.auth.getSession();
  const r = await fetch(API + path, { ...opts, headers: { "Content-Type":"application/json", Authorization:"Bearer " + data.session.access_token } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail :
    Array.isArray(j.detail) ? j.detail.map(x => x.msg.replace("Value error, ", "")).join("; ") : "Request failed");
  return j;
}
const msg = (el, t, ok) => el.innerHTML = t ? `<div class="msg ${ok ? "good" : "err"}">${esc(t)}</div>` : "";
const badge = s => s ? `<span class="b b-${s}">${SAJ[s]}</span>` : "";

// ---------- auth / shell ----------
async function logout() { loggedIn = false; clearTimeout(idleTimer); localStorage.removeItem("lastActive"); await sbc.auth.signOut(); boot(); }
async function boot() {
  const { data } = await sbc.auth.getSession();
  if (data.session && idleCheck()) return expire();
  loggedIn = !!data.session; if (loggedIn) touch();
  $("out").style.display = data.session ? "block" : "none";
  data.session ? shell() : loginView();
}
function loginView() {
  app.innerHTML = `<main><h2>Sign in</h2><input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Sign in</button><div id="m"></div></main>`;
}
async function login() {
  const { error } = await sbc.auth.signInWithPassword({ email:$("em").value, password:$("pw").value });
  error ? msg($("m"), "Wrong email or password") : boot();
}
function shell() {
  const tabs = [["stock","Stock"],["add","Add phone"],["sell","Sell"],["sold","Sold phones"],["tools","Tools"],["home","Summary"]];
  app.innerHTML = `<nav>${tabs.map(([k,l]) => `<button class="${k===tab?"on":""}" onclick="tab='${k}';shell()">${l}</button>`).join("")}</nav><main id="v"></main>`;
  ({ stock:()=>listView("stock"), sold:()=>listView("sold"), add:addView, sell:sellView, home:homeView, tools:toolsView })[tab]();
}
async function homeView() {
  try { const s = await api("/dashboard/summary");
    $("v").innerHTML = `<div class="stats">
      <div class="stat"><b>${s.in_stock}</b>In stock</div><div class="stat"><b>${s.sold}</b>Sold</div>
      <div class="stat"><b>${s.tunisien}</b>Tunisien in stock</div><div class="stat"><b>${s.parallele}</b>Parallèle in stock</div>
      <div class="stat"><b>${s.stock_value_tnd.toFixed(0)}</b>Stock value (TND)</div><div class="stat"><b>${s.gross_margin_tnd.toFixed(0)}</b>Gross margin (TND)</div></div>`; countUp();
  } catch (e) { msg($("v"), e.message); }
}

// ---------- phone display ----------
const head = d => `<strong>${esc(d.model || "Unnamed model")}</strong> <small>· ${CAT[d.category]}</small> ${badge(d.sajalni_status)}<br>
  <small>IMEI ${esc(d.imei1 || "—")}${d.imei2 ? " / " + esc(d.imei2) : ""}${d.serial_number ? " · S/N " + esc(d.serial_number) : ""}</small>`;
function details(d) {
  const s = d.sale, margin = s && s.sale_price != null && d.purchase_price != null ? fmt(s.sale_price - d.purchase_price) : "—";
  const r = [["Supplier", d.supplier_name], ["Purchase date", fdate(d.purchase_date)], ["Purchase price", fmt(d.purchase_price)],
    ["Expected sale", fmt(d.expected_sale_price)], ["Sajalni", SAJ[d.sajalni_status] || "Not checked"], ["Notes", d.notes]];
  if (s) r.push(["Sold on", fdate(s.sale_date)], ["Sale price", fmt(s.sale_price)], ["Margin", margin], ["Sold by", s.seller_name]);
  return `<dl>${r.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v || "—")}</dd>`).join("")}</dl>`;
}
function card(d, kind, i) {
  if (kind === "sold") return `<div class="dev ${d.category}">${head(d)}${details(d)}<div class="acts"><button onclick="receipt(${i})">Receipt PDF</button><button onclick="hist('${d.id}')">History</button><button class="del" onclick="statusForm('${d.id}')">Return</button></div></div>`;
  return `<div class="dev ${d.category}">${head(d)}<div class="acts">
    <button onclick="view(${i})">Read</button><button onclick="editDev(${i})">Edit</button><button class="del" onclick="delDev(${i})">Delete</button></div></div>`;
}
function modal(h) { closeModal(); const m = document.createElement("div"); m.id = "modal";
  m.innerHTML = `<div class="box">${h}<button class="x" onclick="closeModal()">Close</button></div>`; document.body.appendChild(m); }
function closeModal() { const m = $("modal"); if (m) m.remove(); }

// ---------- lists with search + pagination (10 per page) ----------
function listView(kind) {
  const st = S[kind];
  $("v").innerHTML = `<div class="row"><input id="q" type="search" placeholder="Search IMEI, serial, model, supplier" value="${esc(st.q)}">
    <button class="sm" onclick="scanInto('q',()=>searchNow('${kind}'))">Scan</button></div>${typeof chips === "function" && kind === "stock" ? chips() : ""}<div id="list"></div><div id="pager"></div>`;
  loaders[kind] = async () => { if (!$("list").children.length) $("list").innerHTML = skel(); try {
    const p = new URLSearchParams({ page:st.page, page_size:PS });
    if (kind === "stock") p.set("status", "in_stock");
    if (st.cat) p.set("category", st.cat);
    if (st.q) p.set("q", st.q);
    const r = await api((kind === "stock" ? "/devices?" : "/sales?") + p), pages = Math.max(1, Math.ceil(r.total / PS));
    if (st.page > pages) { st.page = pages; return loaders[kind](); }
    rows[kind] = r.items;
    $("list").innerHTML = r.items.map((d, i) => card(d, kind, i)).join("") ||
      `<p><small>${st.q ? "No phone matches this search." : kind === "stock" ? "No phones in stock. Use “Add phone” to enter one." : "No phones sold yet."}</small></p>`;
    $("pager").innerHTML = `<div class="row"><button ${st.page<=1?"disabled":""} onclick="go('${kind}',-1)">Previous</button>
      <span class="pg">Page ${st.page} / ${pages}<br>${r.total} phones</span><button ${st.page>=pages?"disabled":""} onclick="go('${kind}',1)">Next</button></div>`;
  } catch (e) { msg($("list"), e.message); } };
  let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(() => searchNow(kind), 300); };
  loaders[kind]();
}
function searchNow(kind) { S[kind].q = $("q").value.trim(); S[kind].page = 1; loaders[kind](); }
function go(kind, n) { S[kind].page += n; loaders[kind](); }
async function delDev(i) {
  const d = rows.stock[i];
  if (!confirm(`Delete "${d.model || d.imei1}"? It will leave the stock list.`)) return;
  try { await api("/devices/" + d.id, { method:"DELETE" }); loaders.stock(); } catch (e) { toast(e.message); }
}
function editDev(i) {
  const d = rows.stock[i];
  modal(`<h3>Edit phone</h3>${formHtml(d)}<button onclick="saveEdit('${d.id}')">Save changes</button><div id="m"></div>`); chain();
}
async function saveEdit(id) {
  try { await api("/devices/" + id, { method:"PATCH", body:JSON.stringify(collect()) }); closeModal(); loaders.stock(); }
  catch (e) { msg($("m"), e.message); }
}

// ---------- add / edit form ----------
const fld = (id, ph, v, scan) => `<div class="row"><input id="${id}" placeholder="${ph}" value="${esc(v)}" ${/imei/.test(id)?'inputmode="numeric"':""}>
  ${scan ? `<button type="button" class="sm" onclick="scanInto('${id}')">Scan</button>` : ""}</div>`;
function formHtml(d = {}) {
  const o = (k, l) => `<option value="${k}" ${d.sajalni_status===k?"selected":""}>${l}</option>`;
  return `<select id="cat"><option value="tunisien">Smartphone Tunisien</option><option value="parallele" ${d.category==="parallele"?"selected":""}>Smartphone Parallèle</option></select>
  ${fld("imei1","IMEI 1 (15 digits)",d.imei1,1)}${fld("imei2","IMEI 2 (optional)",d.imei2,1)}${fld("serial_number","Serial Number (optional)",d.serial_number,1)}
  ${fld("model","Model",d.model)}${fld("supplier_name","Supplier",d.supplier_name)}
  <div class="row"><input id="purchase_price" type="number" step="0.001" placeholder="Purchase price TND" value="${d.purchase_price ?? ""}">
  <input id="expected_sale_price" type="number" step="0.001" placeholder="Expected sale TND" value="${d.expected_sale_price ?? ""}"></div>
  <select id="sajalni_status"><option value="">Sajalni status: not checked</option>${o("autorise","Autorisé")}${o("non_autorise","Non autorisé")}${o("bloque","Bloqué")}</select>
  <textarea id="notes" placeholder="Notes">${esc(d.notes || "")}</textarea>`;
}
function collect() {
  const f = { category:$("cat").value, sajalni_status:$("sajalni_status").value || null };
  for (const k of ["imei1","imei2","serial_number","model","supplier_name","notes"]) f[k] = $(k).value;
  for (const k of ["purchase_price","expected_sale_price"]) f[k] = $(k).value ? Number($(k).value) : null;
  return f;
}
// USB / Bluetooth scanners type the code then press Enter: Enter jumps to the next field
function chain() {
  const ins = [...document.querySelectorAll("#v input,#modal input")];
  ins.forEach((el, i) => el.onkeydown = e => { if (e.key === "Enter" && ins[i+1]) { e.preventDefault(); ins[i+1].focus(); } });
  if ($("imei1")) $("imei1").focus();
}
function addView() { $("v").innerHTML = formHtml() + `<button onclick="saveDevice()">Save phone</button><div id="m"></div>`; chain(); }
async function saveDevice() {
  try { await api("/devices", { method:"POST", body:JSON.stringify(collect()) }); addView(); msg($("m"), "Phone saved", true); }
  catch (e) { msg($("m"), e.message); }
}

// ---------- sell ----------
function sellView() {
  $("v").innerHTML = `<div class="row"><input id="code" placeholder="Scan or type IMEI / Serial Number">
    <button class="sm" onclick="scanInto('code',findDevice)">Scan</button></div>
    <button onclick="findDevice()">Find phone</button><div id="m"></div><div id="found"></div>`;
  $("code").onkeydown = e => e.key === "Enter" && findDevice(); $("code").focus();
}
async function findDevice() {
  try { current = await api("/devices/lookup/" + encodeURIComponent($("code").value.trim()));
    if (current.status !== "in_stock") return msg($("m"), "This phone is already sold");
    msg($("m"), ""); $("found").innerHTML = `<div class="dev ${current.category}">${head(current)}</div>
      <input id="price" type="number" step="0.001" placeholder="Actual sale price TND" value="${current.expected_sale_price ?? ""}">
      <button onclick="confirmSale()">Confirm sale</button>`;
  } catch (e) { $("found").innerHTML = ""; msg($("m"), e.message); }
}
async function confirmSale() {
  const price = $("price").value;
  if (["non_autorise","bloque"].includes(current.sajalni_status) && !confirm(`Sajalni status is "${SAJ[current.sajalni_status]}". Sell anyway?`)) return;
  if (!price && !confirm("No sale price entered. Sell anyway?")) return;
  try { await api("/sales", { method:"POST", body:JSON.stringify({ device_id:current.id, sale_price:price ? Number(price) : null }) });
    sellView(); celebrate(); toast("Sale recorded", true);
  } catch (e) { msg($("m"), e.message); }
}

// ---------- camera barcode scan (needs HTTPS + camera permission) ----------
let stream = null, zx = null, scanning = false;
function stopScan() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (zx) { try { zx.reset(); } catch {} zx = null; }
  const o = $("scan"); if (o) o.remove();
}
async function scanInto(id, then) {
  stopScan();
  const o = document.createElement("div"); o.id = "scan";
  o.innerHTML = `<video id="vid" playsinline muted></video><p>Point the camera at the barcode</p><button class="x" style="max-width:520px" onclick="stopScan()">Cancel</button>`;
  document.body.appendChild(o);
  const done = v => { stopScan(); beep(); $(id).value = v.trim(); if (then) then(); };
  try {
    if ("BarcodeDetector" in window) {
      const det = new BarcodeDetector(), v = $("vid");
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } });
      v.srcObject = stream; await v.play(); scanning = true;
      while (scanning) {
        try { const r = await det.detect(v); if (r.length) return done(r[0].rawValue); } catch {}
        await new Promise(r => setTimeout(r, 200));
      }
    } else {
      zx = new ZXing.BrowserMultiFormatReader();
      await zx.decodeFromVideoDevice(undefined, "vid", r => { if (r) done(r.getText()); });
    }
  } catch (e) { stopScan(); toast("Camera unavailable. Allow camera access or type the code."); }
}
// ---------- auto logout after inactivity (IDLE_MINUTES in config.js) ----------
const IDLE_MS = (typeof IDLE_MINUTES === "number" ? IDLE_MINUTES : 30) * 60000;
let idleTimer, loggedIn = false, lastTouch = 0;
const lastActive = () => Number(localStorage.getItem("lastActive") || 0);
const idleCheck = () => lastActive() && Date.now() - lastActive() > IDLE_MS;
function touch() { localStorage.setItem("lastActive", Date.now()); clearTimeout(idleTimer); idleTimer = setTimeout(expire, IDLE_MS); }
async function expire() {
  const left = IDLE_MS - (Date.now() - lastActive());   // another tab may still be active
  if (loggedIn && lastActive() && left > 1000) { idleTimer = setTimeout(expire, left); return; }
  loggedIn = false; localStorage.removeItem("lastActive"); await sbc.auth.signOut(); location.reload();
}
["click","keydown","touchstart","scroll","mousemove"].forEach(ev => addEventListener(ev, () => {
  const n = Date.now(); if (loggedIn && n - lastTouch > 5000) { lastTouch = n; touch(); } }, { passive:true }));
document.addEventListener("visibilitychange", () => { if (!document.hidden && loggedIn && idleCheck()) expire(); });
boot();
</script><script src="extras.js"></script>
<script src="ui.js"></script>
</body></html>
